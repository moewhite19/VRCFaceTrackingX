name: Steam Publish
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli

      - name: Download latest translations
        run: crowdin download
        continue-on-error: true
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:EnableWindowsTargeting=true

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish /p:EnableWindowsTargeting=true

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: publish-folder
          path: publish/**

      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v1.0.0
        with:
          file: Directory.Build.props
          xpath: //PropertyGroup/AssemblyVersion
          regex: '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)\.(?<build>0|[1-9]\d*)$'
  
  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-folder
          path: publish

      - name: Deploy to Steam
        env:
          steam_username: ${{ secrets.STEAM_USERNAME }}
          steam_config_vdf: ${{ secrets.STEAM_CONFIG_VDF }}
        if: ${{ env.steam_username != '' && env.steam_config_vdf != '' }}
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 3329480
          buildDescription: ${{ needs.build.outputs.version }}
          depot1Path: publish
          releaseBranch: development

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-folder
          path: publish

      - name: Package release zip
        run: |
          cd publish
          zip -r ../VRCFaceTracking-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VRCFaceTracking ${{ github.ref_name }}
          body: |
            Automated release built from the `${{ github.ref_name }}` tag.

            Contains the full Windows x64 publish output of VRCFaceTracking.
          files: VRCFaceTracking-${{ github.ref_name }}.zip
          generate_release_notes: true
