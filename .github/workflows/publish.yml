name: Publish
on:
  push:
    branches:
      - main
      - 'avalonia/*'
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #- name: Install Crowdin CLI
      #  run: npm install -g @crowdin/cli

      #- name: Download latest translations
      #  run: crowdin download
      #  env:
      #    CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows (x64)
        run: |
          dotnet publish VRCFaceTracking/VRCFaceTracking.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows
          dotnet publish VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows

      - name: Publish Linux (x64)
        run: |
          dotnet publish VRCFaceTracking/VRCFaceTracking.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/linux
          dotnet publish VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/linux

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-windows
          path: publish/windows/**

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-linux
          path: publish/linux/**

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-windows
          path: publish

      - name: Package release zip
        run: |
          cd publish
          zip -r ../VRCFaceTracking-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VRCFaceTracking ${{ github.ref_name }}
          body: |
            Automated release built from the `${{ github.ref_name }}` tag.

            Contains the Windows x64 publish output of VRCFaceTracking.
          files: VRCFaceTracking-${{ github.ref_name }}.zip
          generate_release_notes: true
